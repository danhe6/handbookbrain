# GitLab go-to-market operations: lead scoring, deal desk, sales systems, channel ops, marketing analytics.
# Same public GitLab handbook repo as `gitlab`, different business domain. Onboarding = this file.
name: GitLab GTM Ops
graph: gitlab-gtm
docs:
  type: git
  path: data/handbook
  scope:
    - content/handbook/marketing/marketing-operations/
    - content/handbook/sales/field-operations/
    - content/handbook/enterprise-data/marketing-analytics/
  codeowners: [.gitlab/CODEOWNERS, CODEOWNERS, docs/CODEOWNERS]
  cite_strip: content/handbook/
  doc_base_url: https://handbook.gitlab.com
  mr_url: https://gitlab.com/gitlab-com/content-sites/handbook/-/merge_requests/
  commit_url: https://gitlab.com/gitlab-com/content-sites/handbook/-/commit/
t0: "2026-04-01"
conversations: data/synthetic-gtm          # synthetic meetings / Slack / tickets anchored to real MRs (hb synth)
labels: data/synthetic-gtm/labels.json
synth_profile: gtm
demo_questions:
  - Why did the Marketo trial MQL threshold go from 25 to 31 points, and who decided it?
  - Why was trial threshold scoring added to Marketo lead scoring, and where was that decided?
  - Why are channel partner deals no longer auto-renewed, and who decided that?
  - Why did the Initial Source logic for renewal opportunities change, and who made the call?
  - Why did the FY27 deal registration process change for resale and referral deals?
